<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>About to · On the point of · On the verge of</title><style>*{box-sizing:border-box}body{margin:0;background:#eeeee7;color:#293c32;font:22px/1.55 Arial,sans-serif}main{max-width:1180px;margin:auto;padding:32px 40px 120px}h1{font:normal 42px/1.15 Georgia,serif;margin:0 0 26px}h2{font-size:23px;margin:0 0 12px}p{margin:12px 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}article,.question{background:#faf9f1;border:1px solid #d1d7ca;border-radius:14px;padding:23px}.ru{font-size:19px;color:#5f6e62}.tip{background:#e0e7da;padding:20px;border-radius:12px;margin-top:22px}.example{padding:20px;background:#e8dfd2;border-radius:12px}.question{margin:18px 0}.question label{display:block;margin-bottom:12px}input,textarea{width:100%;font:21px/1.5 Arial,sans-serif;padding:13px;background:#fffef8;border:1px solid #b7c4b4;border-radius:8px;color:#293c32}textarea{min-height:110px;resize:vertical}button,select{font:17px Arial;padding:12px 17px;border:1px solid #b5c0af;background:#f9faf2;border-radius:8px;color:#293c32;cursor:pointer}button:hover{background:#dfe8d8}.question button{margin-top:12px}.feedback{font-size:19px;padding-top:12px;white-space:pre-wrap}.good{color:#28613d}.revise{color:#87532d}footer{position:fixed;bottom:0;left:0;width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:15px 4%;border-top:1px solid #ccd2c6;background:#f6f6edf5}.number{font-size:15px;color:#6c7b6d;margin-bottom:12px}[hidden]{display:none!important}@media(max-width:650px){main{padding:25px 18px 150px}h1{font-size:32px}body{font-size:20px}footer{flex-wrap:wrap}.cards{grid-template-columns:1fr}select{max-width:180px}}</style><main></main><footer><button id="prev">← Назад</button><select aria-label="Выбор слайда"></select><button onclick="download()">Скачать ответы</button><button id="next">Далее →</button></footer><script>const pages=[{"title": "Вот-вот произойдёт", "body": "<p class=\"intro\">Все три выражения описывают событие, которое вот-вот произойдёт.</p><div class=\"cards\"><article><h2>be about to + глагол</h2><p>Вот-вот что-то сделать. Нейтральное сообщение о ближайшем действии.</p><b>The meeting is about to start.</b><p class=\"ru\">Встреча вот-вот начнётся.</p></article><article><h2>be on the point of + -ing</h2><p>Быть в шаге от действия, уже почти начать его. Часто звучит более выразительно или формально.</p><b>I’m on the point of accepting the offer.</b><p class=\"ru\">Я уже почти готов принять предложение.</p></article><article><h2>be on the verge of + -ing</h2><p>Быть на пороге перемены или на грани какого-то состояния. Возможны и успех, и неприятности.</p><b>The company is on the verge of expanding.</b><p class=\"ru\">Компания на пороге расширения.</p></article></div><div class=\"tip\">Значения пересекаются: иногда подходят несколько выражений. После <b>about to</b> — начальная форма; после <b>the point of / the verge of</b> — форма с <b>-ing</b>.</div>", "items": []}, {"title": "Как построить предложение", "body": "<div class=\"cards\"><article><h2>Сейчас</h2><p>I <b>am</b> about to leave.<br>She <b>is</b> on the point of leaving.<br>They <b>are</b> on the verge of leaving.</p></article><article><h2>В прошлом</h2><p>We <b>were</b> about to sign when the terms changed.</p><p class=\"ru\">Мы уже собирались подписать договор, когда условия изменились.</p></article><article><h2>Вопрос и отрицание</h2><p><b>Are you</b> about to send it?<br>We <b>aren’t</b> about to start yet.</p></article></div><div class=\"tip\"><b>Was / were</b> переносит момент «вот-вот» в прошлое. Само выражение не сообщает, произошло ли действие в итоге.</div><p>Сравните:</p><p class=\"example\">We’re about to launch. — Вот-вот запускаем.<br>We’re on the verge of a breakthrough. — Мы на пороге прорыва.</p><p class=\"ru\">После of возможно и существительное. В упражнениях отрабатываем именно конструкцию с -ing.</p>", "items": []}, {"title": "Поставьте глагол в нужную форму", "body": "<p>Введите только пропущенное слово.</p>", "items": [{"q": "The presentation is about to ___ (begin).", "a": ["begin"], "why": ""}, {"q": "I’m on the point of ___ (send) my application.", "a": ["sending"], "why": ""}, {"q": "The team is on the verge of ___ (win) a major contract.", "a": ["winning"], "why": ""}, {"q": "We were about to ___ (leave) when the client called.", "a": ["leave"], "why": ""}, {"q": "She is on the point of ___ (hand) in her notice.", "a": ["handing"], "why": ""}, {"q": "The business is on the verge of ___ (run) out of money.", "a": ["running"], "why": ""}, {"q": "Are you about to ___ (join) the call?", "a": ["join"], "why": ""}, {"q": "They were on the point of ___ (give) up.", "a": ["giving"], "why": ""}]}, {"title": "Восстановите конструкцию", "body": "<p>Заполните пропуск одним словом.</p>", "items": [{"q": "The manager ___ about to announce the decision.", "a": ["is"], "why": ""}, {"q": "We are on the point ___ signing the agreement.", "a": ["of"], "why": ""}, {"q": "___ you about to speak to HR?", "a": ["Are"], "why": ""}, {"q": "The company is on ___ verge of losing a key client.", "a": ["the"], "why": ""}, {"q": "Yesterday, I ___ about to leave when my boss called.", "a": ["was"], "why": ""}, {"q": "They were on the ___ of accepting the offer.", "a": ["point"], "why": ""}, {"q": "I’m about ___ send you the updated figures.", "a": ["to"], "why": ""}, {"q": "We ___ on the verge of securing funding now.", "a": ["are"], "why": ""}]}, {"title": "Исправьте ошибку", "body": "<p>Перепишите каждое предложение целиком. В каждом одна ошибка.</p>", "items": [{"q": "We are about to signing the contract.", "a": ["We are about to sign the contract."], "why": "После about to — начальная форма."}, {"q": "She on the verge of losing her patience.", "a": ["She is on the verge of losing her patience."], "why": "Нужен глагол be: she is."}, {"q": "I was on the point to accepting the job.", "a": ["I was on the point of accepting the job."], "why": "Правильно: on the point of + -ing."}, {"q": "Are you about to sending the invoice?", "a": ["Are you about to send the invoice?"], "why": "После about to — send."}, {"q": "The firm is on verge of expanding.", "a": ["The firm is on the verge of expanding."], "why": "В выражении нужен the."}, {"q": "They were on the point of give up.", "a": ["They were on the point of giving up."], "why": "После of — giving."}]}, {"title": "Скажите иначе", "body": "<p>Перефразируйте, используя выражение в скобках. Сохраните время и смысл.</p>", "items": [{"q": "The interview will begin any moment now. (be about to)", "a": ["The interview is about to begin."], "why": ""}, {"q": "I was just going to send the report when you called. (be on the point of)", "a": ["I was on the point of sending the report when you called."], "why": ""}, {"q": "The company is extremely close to losing its biggest client. (be on the verge of)", "a": ["The company is on the verge of losing its biggest client."], "why": ""}, {"q": "Are you going to press Send right now? (be about to)", "a": ["Are you about to press Send?"], "why": ""}, {"q": "We are just about to sign the contract. (be on the point of)", "a": ["We are on the point of signing the contract."], "why": ""}, {"q": "Our team is extremely close to achieving its target. (be on the verge of)", "a": ["Our team is on the verge of achieving its target."], "why": ""}]}, {"title": "Переведите на английский", "body": "<p>Используйте выражение в скобках. Кнопка покажет образец для сравнения: возможны другие верные формулировки.</p>", "manual": true, "items": [{"q": "Встреча вот-вот начнётся. (about to)", "a": ["The meeting is about to start."], "why": ""}, {"q": "Я уже почти готов отказаться от предложения. (on the point of / reject)", "a": ["I’m on the point of rejecting the offer."], "why": ""}, {"q": "Компания на грани потери крупного клиента. (on the verge of)", "a": ["The company is on the verge of losing a major client."], "why": ""}, {"q": "Ты сейчас собираешься отправить этот файл? (about to)", "a": ["Are you about to send this file?"], "why": ""}, {"q": "Мы уже собирались подписать договор, когда изменились условия. (on the point of)", "a": ["We were on the point of signing the contract when the terms changed."], "why": ""}, {"q": "Наша команда на пороге получения финансирования. (on the verge of / secure)", "a": ["Our team is on the verge of securing funding."], "why": ""}]}];let current=0;const root=document.querySelector('main');const normal=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/i'm/g,'i am').replace(/we're/g,'we are').replace(/they're/g,'they are').replace(/isn't/g,'is not').replace(/[.,!?]/g,'').replace(/\s+/g,' ').trim();pages.forEach((p,i)=>{const s=document.createElement('section');s.hidden=i!==0;s.innerHTML='<div class="number">'+(i+1)+' / '+pages.length+'</div><h1>'+p.title+'</h1>'+p.body;p.items.forEach((t,j)=>{const box=document.createElement('div');box.className='question';const label=document.createElement('label');label.htmlFor='a-'+i+'-'+j;label.textContent=(j+1)+'. '+t.q;const input=document.createElement(p.manual||i>=4?'textarea':'input');input.id=label.htmlFor;input.dataset.prompt=t.q;input.setAttribute('aria-label',t.q);const btn=document.createElement('button');btn.textContent=p.manual?'Показать образец':'Проверить';const feedback=document.createElement('div');feedback.className='feedback';feedback.setAttribute('aria-live','polite');btn.onclick=()=>{const ok=t.a.some(a=>normal(a)===normal(input.value));feedback.className='feedback '+(ok?'good':'revise');feedback.textContent=p.manual?'Образец: '+t.a[0]:ok?'Верно.':(!input.value.trim()?'Правильный ответ: ':'Сравните с правильным ответом: ')+t.a[0]+(t.why?'\n'+t.why:'');};box.append(label,input,btn,feedback);s.append(box)});root.append(s);const o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+p.title;document.querySelector('select').append(o)});function show(n){current=Math.max(0,Math.min(pages.length-1,n));[...root.children].forEach((s,i)=>s.hidden=i!==current);document.querySelector('select').value=current;document.querySelector('#prev').disabled=current===0;document.querySelector('#next').disabled=current===pages.length-1;window.scrollTo(0,0)}document.querySelector('#prev').onclick=()=>show(current-1);document.querySelector('#next').onclick=()=>show(current+1);document.querySelector('select').onchange=e=>show(+e.target.value);const inputs=[...document.querySelectorAll('input,textarea')];inputs.forEach((e,i)=>{try{e.value=localStorage.getItem('imminence-hw-'+i)||''}catch{}e.oninput=()=>{try{localStorage.setItem('imminence-hw-'+i,e.value)}catch{}}});function download(){const text=[...root.children].map((s,i)=>pages[i].title+'\n'+[...s.querySelectorAll('input,textarea')].map(e=>(e.dataset.prompt||'Моя ситуация')+'\n'+(e.value||'(нет ответа)')).join('\n\n')).join('\n\n');const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='B2_My_Homework_Answers.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1)});show(0);</script></html>
